
name: Build Blender ARM64 Debian 13

on:
  workflow_dispatch:
    inputs:
      blender_branch:
        description: "Blender source branch"
        required: true
        default: "blender-v5.3-release"
        type: string

      build_jobs:
        description: "Parallel build jobs (1-8)"
        required: true
        default: "4"
        type: string

      publish_release:
        description: "Publish GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Blender Linux ARM64
    runs-on: ubuntu-26.04-arm

    container:
      image: debian:trixie

    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      BLENDER_BRANCH: ${{ inputs.blender_branch }}
      BUILD_JOBS: ${{ inputs.build_jobs }}

      SOURCE_DIR: ${{ github.workspace }}/blender
      BUILD_DIR: ${{ github.workspace }}/build_linux
      DIST_DIR: ${{ github.workspace }}/dist
      STAGE_DIR: ${{ github.workspace }}/stage

    steps:
      # --------------------------------------------------
      # 1. Install build dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            build-essential \
            gcc-14 \
            g++-14 \
            gfortran \
            make \
            cmake \
            ninja-build \
            git \
            git-lfs \
            subversion \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            pkg-config \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl-dev \
            libgl-dev \
            libepoxy-dev \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            linux-libc-dev \
            zstd \
            xz-utils \
            file \
            binutils \
            patchelf \
            curl \
            wget

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # --------------------------------------------------
      # 2. Check architecture and compiler
      # --------------------------------------------------

      - name: Verify build environment
        shell: bash
        run: |
          set -eux

          echo "===== SYSTEM ====="
          uname -a
          cat /etc/os-release

          echo "===== ARCHITECTURE ====="
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

          echo "===== COMPILER ====="
          gcc-14 --version
          g++-14 --version

          GCC_VERSION="$(gcc-14 -dumpfullversion -dumpversion)"
          GCC_MAJOR="${GCC_VERSION%%.*}"

          test "$GCC_MAJOR" -ge 14

          echo "===== BUILD SETTINGS ====="
          echo "Branch: $BLENDER_BRANCH"
          echo "Jobs: $BUILD_JOBS"

          case "$BUILD_JOBS" in
            ''|*[!0-9]*)
              echo "Invalid BUILD_JOBS"
              exit 1
              ;;
          esac

          test "$BUILD_JOBS" -ge 1
          test "$BUILD_JOBS" -le 8

          if [[ "$BLENDER_BRANCH" == v* ]]; then
            echo "Please specify a branch, not a tag."
            exit 1
          fi

      # --------------------------------------------------
      # 3. Configure Git LFS
      # --------------------------------------------------

      - name: Configure Git LFS
        shell: bash
        run: |
          set -eux

          git lfs version
          git lfs install --skip-repo

          git config --global core.autocrlf false
          git config --global core.filemode true

      # --------------------------------------------------
      # 4. Clone Blender
      # --------------------------------------------------

      - name: Clone Blender source
        shell: bash
        run: |
          set -eux

          git clone \
            --branch "$BLENDER_BRANCH" \
            https://projects.blender.org/blender/blender.git \
            "$SOURCE_DIR"

          cd "$SOURCE_DIR"

          echo "===== SOURCE STATUS ====="
          git status --short --branch
          git log -1 --oneline

          echo "===== VERSION ====="
          grep -E \
            'BLENDER_VERSION|BLENDER_VERSION_CYCLE' \
            source/blender/blender_version.h

          echo "===== LFS ====="
          git lfs pull

      # --------------------------------------------------
      # 5. Verify ARM64 submodule configuration
      # --------------------------------------------------

      - name: Verify ARM64 precompiled library configuration
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          echo "===== CONFIGURED SUBMODULES ====="
          git config -f .gitmodules \
            --get-regexp 'submodule\..*\.path' || true

          echo "===== ARM64 SUBMODULE ====="

          if ! git config -f .gitmodules \
            --get-regexp 'submodule\..*\.path' \
            | awk '$2 == "lib/linux_arm64" { found=1 }
                   END { exit !found }'
          then
            echo "::error::This Blender branch does not configure lib/linux_arm64."
            echo "Cannot use make update for ARM64 precompiled libraries."
            echo "Do not silently continue with incomplete dependencies."
            exit 1
          fi

          echo "ARM64 submodule configuration found."

      # --------------------------------------------------
      # 6. Update Blender dependencies
      # --------------------------------------------------

      - name: Update Blender dependencies
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          make update

          echo "===== LIBRARY DIRECTORY ====="
          ls -lah lib/

          echo "===== ARM64 LIBRARY ====="
          test -d lib/linux_arm64
          ls -lah lib/linux_arm64/

          echo "===== SUBMODULE STATUS ====="
          git submodule status

          echo "===== ARM64 LIBRARY GIT ====="
          git -C lib/linux_arm64 status --short --branch
          git -C lib/linux_arm64 log -1 --oneline

      # --------------------------------------------------
      # 7. Build Blender
      # --------------------------------------------------

      - name: Build Blender
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          export CC=gcc-14
          export CXX=g++-14

          echo "===== BUILD ====="

          make -j"$BUILD_JOBS"

      # --------------------------------------------------
      # 8. Verify build output
      # --------------------------------------------------

      - name: Verify Blender binary
        shell: bash
        run: |
          set -eux

          BLENDER="$BUILD_DIR/bin/blender"

          test -x "$BLENDER"

          echo "===== FILE ====="
          file "$BLENDER"

          echo "===== ELF HEADER ====="
          readelf -h "$BLENDER"

          echo "===== BLENDER VERSION ====="
          "$BLENDER" --version

          echo "===== LINKED LIBRARIES ====="
          ldd "$BLENDER" | tee "$GITHUB_WORKSPACE/ldd.txt"

          if grep -q "not found" "$GITHUB_WORKSPACE/ldd.txt"; then
            echo "::error::Missing shared libraries detected."
            exit 1
          fi

      # --------------------------------------------------
      # 9. Check Blender build features
      # --------------------------------------------------

      - name: Check Blender features
        shell: bash
        run: |
          set -eux

          "$BUILD_DIR/bin/blender" \
            -b \
            --python-expr '
          import bpy
          import json

          options = bpy.app.build_options

          names = [
              "cycles",
              "openimagedenoise",
              "ffmpeg",
              "openvdb",
              "usd",
              "alembic",
              "opensubdiv",
              "opengl",
              "vulkan",
          ]

          result = {
              name: getattr(options, name, None)
              for name in names
          }

          print("===== BLENDER BUILD FEATURES =====")
          print(json.dumps(result, indent=2))

          print("Blender version:", bpy.app.version_string)
          '

      # --------------------------------------------------
      # 10. Test Cycles CPU rendering
      # --------------------------------------------------

      - name: Test Cycles CPU rendering
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cycles.py <<'PY'
          import bpy
          from mathutils import Vector

          bpy.ops.wm.read_factory_settings(use_empty=True)

          scene = bpy.context.scene

          # Cube
          bpy.ops.mesh.primitive_cube_add(
              size=2,
              location=(0, 0, 0)
          )

          # Camera
          bpy.ops.object.camera_add(
              location=(4, -6, 4)
          )

          camera = bpy.context.object
          direction = Vector((0, 0, 0)) - camera.location
          camera.rotation_euler = direction.to_track_quat(
              '-Z', 'Y'
          ).to_euler()

          scene.camera = camera

          # Light
          bpy.ops.object.light_add(
              type='AREA',
              location=(4, -4, 5)
          )

          light = bpy.context.object
          light.data.energy = 500
          light.data.shape = 'DISK'
          light.data.size = 5

          # Cycles CPU
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = 8

          # Output
          scene.render.resolution_x = 320
          scene.render.resolution_y = 240
          scene.render.resolution_percentage = 100

          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = '/tmp/blender-cycles-test.png'

          bpy.ops.render.render(write_still=True)

          print("Cycles CPU render completed.")
          PY

          "$BUILD_DIR/bin/blender" \
            -b \
            --python /tmp/test_cycles.py

          test -s /tmp/blender-cycles-test.png

          file /tmp/blender-cycles-test.png

      # --------------------------------------------------
      # 11. Prepare portable package
      # --------------------------------------------------

      - name: Prepare portable package
        shell: bash
        run: |
          set -eux

          mkdir -p "$DIST_DIR"
          mkdir -p "$STAGE_DIR"

          VERSION="$(
            "$BUILD_DIR/bin/blender" \
              --version \
              | head -n 1 \
              | awk '{print $2}'
          )"

          PACKAGE_NAME="blender-${VERSION}-linux-arm64-debian13"

          PACKAGE_DIR="$STAGE_DIR/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"

          # Copy the entire Blender runtime directory.
          cp -a "$BUILD_DIR/bin/." "$PACKAGE_DIR/"

          # Runtime launcher.
          cat > "$PACKAGE_DIR/run-blender.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          HERE="$(cd "$(dirname "$0")" && pwd)"

          exec "$HERE/blender" "$@"
          SH

          chmod +x "$PACKAGE_DIR/run-blender.sh"

          # Build information.
          cat > "$PACKAGE_DIR/BUILD-INFO.txt" <<EOF
          Blender version: $VERSION
          Architecture: ARM64
          Operating system build environment: Debian 13 Trixie
          Compiler: GCC 14
          Source branch: $BLENDER_BRANCH
          Source commit: $(git -C "$SOURCE_DIR" rev-parse HEAD)
          Build jobs: $BUILD_JOBS
          CPU rendering: Cycles CPU
          GPU backend: Depends on target device drivers
          EOF

          cat > "$PACKAGE_DIR/README-RUNTIME.txt" <<'EOF'
          Blender ARM64 portable build

          Requirements:
          - ARM64 Linux
          - Debian 13 or compatible Linux environment
          - Compatible system libraries
          - Graphics driver for graphical viewport rendering

          Start GUI:
            ./run-blender.sh

          Background mode:
            ./run-blender.sh -b

          Print version:
            ./run-blender.sh --version

          Cycles CPU:
            ./run-blender.sh -b -E CYCLES --python-expr \
              "import bpy; bpy.context.scene.cycles.device='CPU'"

          Note:
          This package is not a fully static binary.
          It still depends on system libraries and graphics drivers.
          EOF

          cp "$GITHUB_WORKSPACE/ldd.txt" "$PACKAGE_DIR/"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

          echo "===== PACKAGE CONTENTS ====="
          find "$PACKAGE_DIR" -maxdepth 2 -type f | head -n 100

      # --------------------------------------------------
      # 12. Package
      # --------------------------------------------------

      - name: Create compressed archive
        shell: bash
        run: |
          set -eux

          tar \
            --zstd \
            -cf "$DIST_DIR/${PACKAGE_NAME}.tar.zst" \
            -C "$STAGE_DIR" \
            "$PACKAGE_NAME"

          cd "$DIST_DIR"

          sha256sum \
            "${PACKAGE_NAME}.tar.zst" \
            > SHA256SUMS

          echo "===== ARCHIVE ====="
          ls -lh

          echo "===== SHA256 ====="
          cat SHA256SUMS

      # --------------------------------------------------
      # 13. Upload build artifact
      # --------------------------------------------------

      - name: Upload Blender artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64-debian13
          path: |
            dist/*.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # --------------------------------------------------
      # 14. Optional GitHub Release
      # --------------------------------------------------

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-arm64-${{ github.run_number }}
          name: Blender ARM64 Debian 13 Build ${{ github.run_number }}
          body: |
            Blender ARM64 build for Debian 13.

            Architecture: aarch64
            Source branch: ${{ inputs.blender_branch }}
            Build environment: Debian 13 Trixie
            Rendering: Cycles CPU

            This is a custom build, not an official Blender release.
          files: |
            dist/*.tar.zst
            dist/SHA256SUMS

      # --------------------------------------------------
      # 15. Upload diagnostic logs if build fails
      # --------------------------------------------------

      - name: Upload diagnostic files
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: blender-arm64-build-diagnostics
          path: |
            build_linux/CMakeCache.txt
            build_linux/CMakeFiles/CMakeError.log
            build_linux/CMakeFiles/CMakeOutput.log
            blender/.gitmodules
            blender/.git/config
            blender/lib/linux_arm64
          if-no-files-found: ignore
          retention-days: 7
