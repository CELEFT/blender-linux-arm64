name: Build Blender 5.2.3 ARM64 Debian 13

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "4"
        type: string

      publish_release:
        description: "Publish the result as a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Blender 5.2.3 for ARM64
    runs-on: ubuntu-26.04-arm

    container:
      image: debian:trixie

    timeout-minutes: 480

    env:
      BLENDER_TAG: v5.2.3
      BUILD_JOBS: ${{ inputs.build_jobs }}

      SOURCE_DIR: ${{ github.workspace }}/blender
      BUILD_DIR: ${{ github.workspace }}/build_linux
      DIST_DIR: ${{ github.workspace }}/dist
      STAGE_DIR: ${{ github.workspace }}/stage
      PKG_DIR: ${{ github.workspace }}/build_linux/deps_arm64/packages

    steps:
      # --------------------------------------------------
      # 1. Validate parameters
      # --------------------------------------------------
      - name: Validate build parameters
        shell: bash
        run: |
          set -euxo pipefail

          if [[ ! "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid BUILD_JOBS: $BUILD_JOBS"
            exit 1
          fi

          if [ "$(uname -m)" != "aarch64" ]; then
            echo "This workflow requires a native ARM64 runner."
            uname -a
            exit 1
          fi

          echo "Build jobs: $BUILD_JOBS"
          echo "Architecture: $(uname -m)"

      # --------------------------------------------------
      # 2. Install system dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc g++ cmake ninja-build make pkg-config \
            git git-lfs subversion curl wget ca-certificates file patchelf rsync \
            unzip zip xz-utils zstd tar bzip2 patch perl gawk m4 autoconf automake \
            autopoint libtool gettext help2man texinfo tcl meson flex bison yasm nasm \
            python3 python3-dev python3-venv python3-pip python3-mako python3-yaml \
            python3-setuptools python3-wheel libssl-dev libffi-dev libxml2-dev \
            libzstd-dev liblzma-dev libbz2-dev libreadline-dev libncurses-dev \
            libsqlite3-dev libtinfo-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libfribidi-dev libx11-dev libxext-dev libxrender-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev \
            libxxf86vm-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libglu1-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libepoxy-dev libosmesa6-dev libdbus-1-dev \
            libudev-dev libopenal-dev libpulse-dev libjack-jackd2-dev libsndfile1-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev libopenjp2-7-dev \
            libavif-dev libtbb-dev libjemalloc-dev

          git lfs install

      # --------------------------------------------------
      # 3. Verify environment
      # --------------------------------------------------
      - name: Verify ARM64 environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          dpkg --print-architecture
          gcc --version
          cmake --version
          python3 --version
          test "$(dpkg --print-architecture)" = "arm64"

      - name: Verify dependency build tools
        shell: bash
        run: |
          set -euxo pipefail
          for tool in cmake ninja gcc g++ make git curl python3 tclsh autopoint help2man meson nasm yasm; do
            command -v "$tool"
          done

      # --------------------------------------------------
      # 4. Fix MD5 for OpenSSL 3 (Debian 13 / trixie)
      # --------------------------------------------------
      - name: Fix hashlib MD5 for OpenSSL 3 strict mode
        shell: bash
        run: |
          set -euxo pipefail

          SITE_DIR="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
          echo "Python site-packages: $SITE_DIR"

          SITECUSTOMIZE="$SITE_DIR/sitecustomize.py"

          if [ -f "$SITECUSTOMIZE" ]; then
            cp "$SITECUSTOMIZE" "$SITECUSTOMIZE.bak"
          fi

          cat > "$SITECUSTOMIZE" <<'PYEOF'
          import hashlib

          _original_md5 = hashlib.md5

          def md5(*args, **kwargs):
              kwargs.setdefault("usedforsecurity", False)
              return _original_md5(*args, **kwargs)

          hashlib.md5 = md5
          PYEOF

          echo "--- sitecustomize.py ---"
          cat "$SITECUSTOMIZE"

          python3 -c "import hashlib; print('MD5 OK:', hashlib.md5(b'blender').hexdigest())"

      # --------------------------------------------------
      # 5. Configure Git LFS
      # --------------------------------------------------
      - name: Configure Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://projects.blender.org/".insteadOf "https://git.blender.org/"
          git lfs install

      # --------------------------------------------------
      # 6. Cache Blender source repository
      # --------------------------------------------------
      - name: Cache Blender source repository
        uses: actions/cache@v4
        with:
          path: blender
          key: ${{ runner.os }}-${{ runner.arch }}-blender-source-${{ env.BLENDER_TAG }}

      # --------------------------------------------------
      # 7. Checkout Blender source
      # --------------------------------------------------
      - name: Checkout Blender 5.2.3 source
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "$SOURCE_DIR/.git" ]; then
            CURRENT_TAG="$(
              git -C "$SOURCE_DIR" describe \
                --tags \
                --exact-match 2>/dev/null || true
            )"
            if [ "$CURRENT_TAG" != "$BLENDER_TAG" ]; then
              rm -rf "$SOURCE_DIR"
            fi
          fi

          if [ ! -d "$SOURCE_DIR/.git" ]; then
            git clone \
              --depth 1 \
              --branch "$BLENDER_TAG" \
              https://projects.blender.org/blender/blender.git \
              "$SOURCE_DIR"
          fi

          cd "$SOURCE_DIR"
          git lfs pull
          echo "Blender version:"
          git describe --tags --exact-match
          git log -1 --oneline

      # --------------------------------------------------
      # 8. Cache Dependencies Packages
      # --------------------------------------------------
      - name: Cache Blender Dependencies Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PKG_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-blender-deps-packages-${{ env.BLENDER_TAG }}

      # --------------------------------------------------
      # 9. Pre-download Dependencies with Retry
      # --------------------------------------------------
      - name: Pre-download dependencies with retry
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          
          python3 << 'PYEOF'
          import re, os, subprocess, sys, time

          versions_file = "build_files/build_environment/cmake/versions.cmake"
          pkg_dir = os.environ.get("PKG_DIR")
          os.makedirs(pkg_dir, exist_ok=True)

          with open(versions_file) as f:
              content = f.read()

          versions = dict(re.findall(r'set\((\w+)_VERSION\s+([^\)]+)\)', content))
          uris = re.findall(r'set\((\w+)_URI\s+([^\)]+)\)', content)
          files = dict(re.findall(r'set\((\w+)_FILE\s+([^\)]+)\)', content))

          def download(url, dest):
              if os.path.exists(dest) and os.path.getsize(dest) > 0:
                  print(f"Already exists: {os.path.basename(dest)}")
                  return
              print(f"Downloading {url} -> {dest}")
              retries = 5
              for i in range(retries):
                  try:
                      subprocess.run(["curl", "-L", "--connect-timeout", "15", "--retry", "3", "-s", "-o", dest, url], check=True)
                      if os.path.getsize(dest) > 0:
                          print(f"Success: {os.path.basename(dest)}")
                          return
                  except subprocess.CalledProcessError:
                      print(f"Attempt {i+1} failed for {url}, retrying in 5s...")
                      time.sleep(5)
              print(f"ERROR: Failed to download {url} after {retries} attempts.")
              sys.exit(1)

          for name, uri in uris:
              if name not in files:
                  continue
              final_uri = uri
              final_file = files[name]
              for var_name, var_val in versions.items():
                  final_uri = final_uri.replace("${" + var_name + "}", var_val)
                  final_file = final_file.replace("${" + var_name + "}", var_val)
              
              dest = os.path.join(pkg_dir, final_file)
              download(final_uri, dest)
              
          print("All dependencies downloaded successfully.")
          PYEOF

      # --------------------------------------------------
      # 10. Build Blender dependencies
      # --------------------------------------------------
      - name: Build Blender Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          
          # 显式指定 PACKAGE_DIR，使 CMake 优先从我们预下载的本地目录读取
          make deps -j"$BUILD_JOBS" ARGS="-DPACKAGE_DIR=$PKG_DIR"

      # --------------------------------------------------
      # 11. Build Blender
      # --------------------------------------------------
      - name: Build Blender
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          
          make config
          make -j"$BUILD_JOBS"

      # --------------------------------------------------
      # 12. Package Blender
      # --------------------------------------------------
      - name: Package Blender
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          
          make package
          
          mkdir -p "$DIST_DIR"
          find "$BUILD_DIR" -name "*.tar.*" -exec cp {} "$DIST_DIR/" \;
          
          echo "Generated packages:"
          ls -lh "$DIST_DIR"

      # --------------------------------------------------
      # 13. Upload Artifacts
      # --------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64-package
          path: ${{ env.DIST_DIR }}/*.tar.*
          if-no-files-found: error

      # --------------------------------------------------
      # 14. Publish Release (Optional)
      # --------------------------------------------------
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BLENDER_TAG }}-arm64
          name: Blender ${{ env.BLENDER_TAG }} (Linux ARM64)
          body: |
            Automated build of Blender ${{ env.BLENDER_TAG }} for Linux ARM64 (Debian 13 / trixie).
          files: ${{ env.DIST_DIR }}/*.tar.*
          token: ${{ secrets.GITHUB_TOKEN }}
