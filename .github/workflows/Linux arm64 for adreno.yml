name: Build Blender 5.2.3 ARM64 (Rocky Linux 8)

on:
  workflow_dispatch:
    inputs:
      blender_version:
        description: 'Blender version tag'
        required: true
        default: 'v5.2.3'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - lite
          - debug
      gcc_version:
        description: 'GCC version'
        required: true
        default: '14'
        type: choice
        options:
          - 14
          - 11
      rebuild_deps:
        description: 'Force rebuild dependencies'
        required: false
        default: false
        type: boolean
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: rockylinux:8
      options: --privileged --user root

    steps:
      - name: Install base dependencies
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          dnf makecache
          retry 10 15 dnf install -y epel-release
          retry 10 15 dnf install -y git git-lfs gcc-toolset-${{ github.event.inputs.gcc_version }} ccache

          # 绕过容器内 sudo 的 TTY 认证限制
          mv /usr/bin/sudo /usr/bin/sudo.orig || true
          cat > /usr/bin/sudo << 'EOF'
          #!/bin/bash
          if [ "$1" = "-y" ] || [ "$1" = "-n" ] || [ "$1" = "-E" ]; then
            shift
          fi
          exec "$@"
          EOF
          chmod +x /usr/bin/sudo

      - name: Setup Git LFS
        run: git-lfs install

      - name: Clone Blender repository
        run: |
          mkdir -p ~/blender-git
          cd ~/blender-git
          git clone -b ${{ github.event.inputs.blender_version }} --single-branch --depth 1 https://projects.blender.org/blender/blender.git

      - name: Clone patches repository
        run: |
          cd ~/blender-git
          # 优先尝试克隆你的 patches-repo，如果没配则 fallback 到 lfdevs
          if ! git clone -b ci --depth 1 ${{ github.server_url }}/${{ github.repository }}.git patches-repo 2>/dev/null; then
            echo "Failed to clone own repo, falling back to lfdevs community patches..."
            git clone -b ci --depth 1 https://github.com/lfdevs/blender-linux-arm64.git patches-repo
          fi

      - name: Apply patches
        run: |
          cd ~/blender-git/blender
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          PATCH_DIR=~/blender-git/patches-repo/patches/${{ github.event.inputs.blender_version }}
          if [ -d "$PATCH_DIR" ]; then
            echo "Found patches directory: $PATCH_DIR"
            for patch in $(ls -1 "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
              echo "Applying patch: $patch"
              git apply --verbose "$patch" || echo "Patch failed, skipping..."
            done
            git add -A
            git commit -m "Apply patches for ${{ github.event.inputs.blender_version }}" || echo "No changes to commit"
          else
            echo "No patches directory found for ${{ github.event.inputs.blender_version }}, trying v5.1.0..."
            FALLBACK_DIR=~/blender-git/patches-repo/patches/v5.1.0
            if [ -d "$FALLBACK_DIR" ]; then
              for patch in $(ls -1 "$FALLBACK_DIR"/*.patch 2>/dev/null | sort); do
                git apply --check "$patch" 2>/dev/null && git apply --verbose "$patch"
              done
            fi
          fi

          # --- 强力兜底：确保 ARM64 下不安装 ROCm ---
          # 解决 linux_rocky8_setup.sh 在 ARM64 上尝试安装 AMD 计算库导致的崩溃
          SETUP_SCRIPT="build_files/build_environment/linux/linux_rocky8_setup.sh"
          if [ -f "$SETUP_SCRIPT" ] && ! grep -q 'if \[ "$(uname -i)" != "aarch64" \]' "$SETUP_SCRIPT"; then
            echo "Injecting aarch64 check for ROCm in $SETUP_SCRIPT"
            sed -i '/# Register ROCm packages/i if [ "$(uname -i)" != "aarch64" ]; then' "$SETUP_SCRIPT"
            sed -i '/update-alternatives --set rocm/a fi' "$SETUP_SCRIPT"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          chmod +x ~/blender-git/blender/build_files/build_environment/linux/linux_rocky8_setup.sh
          retry 10 15 ~/blender-git/blender/build_files/build_environment/linux/linux_rocky8_setup.sh
          echo "Cleaning dnf cache..."
          dnf clean all

      - name: Cache Blender dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ~/blender-git/blender/lib/linux_arm64
          key: blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          cd ~/blender-git/blender
          
          # 尝试规避部分依赖在编译时需要 CUDA 的问题
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}
          export PATH=/usr/local/cuda/bin${PATH:+:${PATH}}
          export LANG=en_US.UTF-8
          
          export CC=/opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/root/usr/bin/g++
          
          retry 10 15 make deps -j$(nproc)
          unset CC CXX

      - name: Save Blender dependencies cache
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        uses: actions/cache/save@v4
        with:
          path: ~/blender-git/blender/lib/linux_arm64
          key: blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Clean dependencies build artifacts
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        run: |
          echo "Cleaning dependencies build directory to save space..."
          rm -rf ~/blender-git/build_linux
          echo "Dependencies build directory cleaned"

      - name: Verify dependencies
        run: |
          echo "Checking dependencies directory..."
          ls -lah ~/blender-git/blender/lib/linux_arm64/ || echo "Dependencies not found!"

      - name: Build Blender
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          
          mkdir -p ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          cd ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          
          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DWITH_LIBS_PRECOMPILED=ON
            -DLIBDIR=$HOME/blender-git/blender/lib/linux_arm64
            -DWITH_INSTALL_PORTABLE=ON
            -DCPACK_BINARY_TGZ=ON
            -DCPACK_BINARY_STGZ=OFF
            -DCPACK_BINARY_TZ=OFF
            -DCPACK_SOURCE_TBZ2=OFF
            -DCPACK_SOURCE_TGZ=OFF
            -DCPACK_SOURCE_TXZ=OFF
            -DCPACK_SOURCE_TZ=OFF
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )

          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            cmake -C ../blender/build_files/cmake/config/blender_release.cmake "${CMAKE_ARGS[@]}" ../blender
          elif [ "${{ github.event.inputs.build_type }}" == "lite" ]; then
            cmake -C ../blender/build_files/cmake/config/blender_lite.cmake "${CMAKE_ARGS[@]}" ../blender
          else
            CMAKE_ARGS[1]="Debug"
            cmake "${CMAKE_ARGS[@]}" ../blender
          fi

          echo "Building Blender..."
          ninja
          
          echo "Build completed successfully!"
          echo "ccache statistics:"
          ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Blender
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          ccache -C
          cd ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          echo "Packaging Blender..."
          cpack
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.tar.gz" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64-${{ github.event.inputs.blender_version }}-${{ github.event.inputs.build_type }}
          path: |
            ~/blender-git/build_linux_${{ github.event.inputs.build_type }}/*.tar.gz
            ~/blender-git/build_linux_${{ github.event.inputs.build_type }}/sha256sums.txt
          retention-days: 90

      - name: Notify webhook on build failure
        if: ${{ failure() }}
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "WEBHOOK_URL is not configured, skipping failure notification"
            exit 0
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "curl is not available, skipping failure notification"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "GitHub CI Activity",
                  "content": [
                    [
                      {
                        "tag": "text",
                        "text": "Some jobs were not successful: "
                      },
                      {
                        "tag": "a",
                        "text": "View workflow run",
                        "href": "${RUN_URL}"
                      }
                    ]
                  ]
                }
              }
            }
          }
          EOF
          )

          curl --fail --show-error --silent -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs:
      - build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; -exec echo \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)
          cat <<'EOF' > release_body.md
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.blender_version }}
          name: Blender ${{ github.event.inputs.blender_version }} (Linux ARM64)
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.tar.gz
