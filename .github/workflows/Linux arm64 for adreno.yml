
name: Build Blender 5.2.3 ARM64 Debian 13

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: "Parallel build jobs (1-8)"
        required: true
        default: "4"
        type: string

      publish_release:
        description: "Publish GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Blender 5.2.3 Linux ARM64
    runs-on: ubuntu-26.04-arm

    container:
      image: debian:trixie

    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      BLENDER_TAG: v5.2.3
      BUILD_JOBS: ${{ inputs.build_jobs }}

      SOURCE_DIR: ${{ github.workspace }}/blender
      BUILD_DIR: ${{ github.workspace }}/build_linux
      DIST_DIR: ${{ github.workspace }}/dist
      STAGE_DIR: ${{ github.workspace }}/stage

    steps:

      # ================================================
      # 1. Install build dependencies
      # ================================================

      - name: Install system packages
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            wget \
            git \
            git-lfs \
            subversion \
            build-essential \
            gcc-14 \
            g++-14 \
            gfortran \
            make \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            perl \
            patch \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            gperf \
            nasm \
            yasm \
            zstd \
            xz-utils \
            file \
            binutils \
            patchelf \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl-dev \
            libgl-dev \
            libepoxy-dev \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libpulse-dev \
            libjack-dev \
            libsndfile1-dev \
            libopenal-dev \
            libssl-dev \
            libffi-dev \
            linux-libc-dev

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # ================================================
      # 2. Verify environment
      # ================================================

      - name: Verify environment
        shell: bash
        run: |
          set -eux

          echo "===== OS ====="
          cat /etc/os-release

          echo "===== ARCH ====="
          uname -m
          dpkg --print-architecture

          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

          echo "===== GCC ====="
          gcc-14 --version
          g++-14 --version

          echo "===== CMAKE ====="
          cmake --version

          CMAKE_VERSION="$(cmake --version | head -n1 | awk '{print $3}')"
          CMAKE_MAJOR="${CMAKE_VERSION%%.*}"

          # Blender's dependency build scripts in this version
          # may fail with CMake 4.x due to legacy CMake behavior.
          if [ "$CMAKE_MAJOR" -ge 4 ]; then
            echo "::error::CMake 4.x is not supported by this dependency build."
            exit 1
          fi

          echo "===== DISK ====="
          df -h

          echo "===== MEMORY ====="
          free -h || true

          case "$BUILD_JOBS" in
            ''|*[!0-9]*)
              echo "::error::Invalid build_jobs"
              exit 1
              ;;
          esac

          test "$BUILD_JOBS" -ge 1
          test "$BUILD_JOBS" -le 8

      # ================================================
      # 3. Configure Git LFS
      # ================================================

      - name: Configure Git LFS
        shell: bash
        run: |
          set -eux

          git lfs version
          git lfs install --skip-repo

          git config --global core.autocrlf false

      # ================================================
      # 4. Clone exact Blender 5.2.3 tag
      # ================================================

      - name: Clone Blender 5.2.3
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "$BLENDER_TAG" \
            https://projects.blender.org/blender/blender.git \
            "$SOURCE_DIR"

          cd "$SOURCE_DIR"

          echo "===== GIT VERSION ====="
          git describe --tags --exact-match
          git log -1 --oneline

          echo "===== BLENDER VERSION ====="
          grep -E \
            'BLENDER_VERSION|BLENDER_VERSION_CYCLE' \
            source/blender/blender_version.h

          test "$(git describe --tags --exact-match)" = "$BLENDER_TAG"

          echo "===== LFS ====="
          git lfs pull

      # ================================================
      # 5. Verify source configuration
      # ================================================

      - name: Inspect source submodules
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          echo "===== .gitmodules ====="
          cat .gitmodules

          echo "===== CONFIGURED LIBRARIES ====="
          git config -f .gitmodules \
            --get-regexp 'submodule\..*\.path' || true

          echo "===== CHECK ARM64 CONFIGURATION ====="

          if git config -f .gitmodules \
            --get-regexp 'submodule\..*\.path' \
            | awk '$2 == "lib/linux_arm64" { found=1 }
                   END { exit !found }'
          then
            echo "ARM64 precompiled library submodule exists."
          else
            echo "No ARM64 precompiled library submodule."
            echo "Dependencies will be built from source."
          fi

      # ================================================
      # 6. Build all Blender dependencies
      # ================================================

      - name: Build ARM64 dependencies from source
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          export CC=gcc-14
          export CXX=g++-14
          export NPROCS="$BUILD_JOBS"

          echo "===== DEPENDENCY SOURCE ====="
          ls -lah build_files/build_environment/

          echo "===== BUILD DEPENDENCIES ====="

          make deps

          echo "===== DEPENDENCY BUILD FINISHED ====="

          echo "===== LIBRARY DIRECTORY ====="
          ls -lah lib/

          echo "===== ARM64 LIBRARY OUTPUT ====="

          if [ ! -d lib/linux_arm64 ]; then
            echo "::error::make deps did not generate lib/linux_arm64"
            exit 1
          fi

          find lib/linux_arm64 -maxdepth 2 -type d | head -n 100

          echo "===== DISK AFTER DEPENDENCIES ====="
          df -h

      # ================================================
      # 7. Build Blender itself
      # ================================================

      - name: Build Blender 5.2.3
        shell: bash
        run: |
          set -eux

          cd "$SOURCE_DIR"

          export CC=gcc-14
          export CXX=g++-14
          export NPROCS="$BUILD_JOBS"

          make

      # ================================================
      # 8. Verify binary
      # ================================================

      - name: Verify Blender binary
        shell: bash
        run: |
          set -eux

          BLENDER="$BUILD_DIR/bin/blender"

          test -x "$BLENDER"

          echo "===== FILE ====="
          file "$BLENDER"

          echo "===== ELF ====="
          readelf -h "$BLENDER"

          echo "===== VERSION ====="
          "$BLENDER" --version

          echo "===== LINKED LIBRARIES ====="
          ldd "$BLENDER" | tee "$GITHUB_WORKSPACE/ldd.txt"

          if grep -q "not found" "$GITHUB_WORKSPACE/ldd.txt"; then
            echo "::error::Missing shared libraries."
            exit 1
          fi

      # ================================================
      # 9. Verify Blender features
      # ================================================

      - name: Verify build features
        shell: bash
        run: |
          set -eux

          "$BUILD_DIR/bin/blender" \
            -b \
            --python-expr '
          import bpy
          import json

          options = bpy.app.build_options

          features = [
              "cycles",
              "openimagedenoise",
              "ffmpeg",
              "openvdb",
              "usd",
              "alembic",
              "opensubdiv",
              "opengl",
              "vulkan",
          ]

          result = {}

          for name in features:
              result[name] = getattr(options, name, None)

          print("===== BUILD FEATURES =====")
          print(json.dumps(result, indent=2))

          print("Blender:", bpy.app.version_string)
          print("Build platform:", bpy.app.build_platform)
          '

      # ================================================
      # 10. Cycles CPU render test
      # ================================================

      - name: Test Cycles CPU rendering
        shell: bash
        run: |
          set -eux

          cat > /tmp/test_cycles.py <<'PY'
          import bpy
          from mathutils import Vector

          bpy.ops.wm.read_factory_settings(use_empty=True)

          scene = bpy.context.scene

          # Create cube.
          bpy.ops.mesh.primitive_cube_add(
              size=2,
              location=(0, 0, 0)
          )

          # Create camera.
          bpy.ops.object.camera_add(
              location=(4, -6, 4)
          )

          camera = bpy.context.object

          direction = Vector((0, 0, 0)) - camera.location

          camera.rotation_euler = direction.to_track_quat(
              '-Z', 'Y'
          ).to_euler()

          scene.camera = camera

          # Create light.
          bpy.ops.object.light_add(
              type='AREA',
              location=(4, -4, 5)
          )

          light = bpy.context.object
          light.data.energy = 500
          light.data.shape = 'DISK'
          light.data.size = 5

          # Configure Cycles CPU.
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = 8

          # Configure output.
          scene.render.resolution_x = 320
          scene.render.resolution_y = 240
          scene.render.resolution_percentage = 100

          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = '/tmp/blender-cycles-test.png'

          bpy.ops.render.render(write_still=True)

          print("Cycles CPU rendering successful.")
          PY

          "$BUILD_DIR/bin/blender" \
            -b \
            --python /tmp/test_cycles.py

          test -s /tmp/blender-cycles-test.png

          file /tmp/blender-cycles-test.png

      # ================================================
      # 11. Prepare portable package
      # ================================================

      - name: Prepare portable package
        shell: bash
        run: |
          set -eux

          mkdir -p "$DIST_DIR"
          mkdir -p "$STAGE_DIR"

          VERSION="$(
            "$BUILD_DIR/bin/blender" \
              --version \
              | head -n 1 \
              | awk '{print $2}'
          )"

          PACKAGE_NAME="blender-${VERSION}-linux-arm64-debian13"
          PACKAGE_DIR="$STAGE_DIR/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"

          # Copy complete portable runtime.
          cp -a "$BUILD_DIR/bin/." "$PACKAGE_DIR/"

          # Runtime launcher.
          cat > "$PACKAGE_DIR/run-blender.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          HERE="$(cd "$(dirname "$0")" && pwd)"

          exec "$HERE/blender" "$@"
          SH

          chmod +x "$PACKAGE_DIR/run-blender.sh"

          # Build information.
          cat > "$PACKAGE_DIR/BUILD-INFO.txt" <<EOF
          Blender version: $VERSION
          Source tag: $BLENDER_TAG
          Architecture: ARM64
          Operating system: Debian 13 Trixie
          Compiler: GCC 14
          Build jobs: $BUILD_JOBS
          Dependencies: Built from source
          Rendering: Cycles CPU
          GPU: Depends on target system graphics drivers
          Source commit: $(git -C "$SOURCE_DIR" rev-parse HEAD)
          EOF

          # Runtime documentation.
          cat > "$PACKAGE_DIR/README-RUNTIME.txt" <<'EOF'
          Blender 5.2.3 ARM64 Portable Build

          Target:
          Debian 13 ARM64

          Start GUI:
            ./run-blender.sh

          Show version:
            ./run-blender.sh --version

          Background:
            ./run-blender.sh -b

          CPU rendering:
            ./run-blender.sh -b -E CYCLES

          This is not a fully static binary.
          The system still needs compatible shared libraries
          and graphics drivers.
          EOF

          cp "$GITHUB_WORKSPACE/ldd.txt" "$PACKAGE_DIR/"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

          echo "===== PACKAGE CONTENTS ====="
          du -sh "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -maxdepth 2 -type f | head -n 100

      # ================================================
      # 12. Create archive and checksum
      # ================================================

      - name: Create archive
        shell: bash
        run: |
          set -eux

          tar \
            --zstd \
            -cf "$DIST_DIR/${PACKAGE_NAME}.tar.zst" \
            -C "$STAGE_DIR" \
            "$PACKAGE_NAME"

          cd "$DIST_DIR"

          sha256sum \
            "${PACKAGE_NAME}.tar.zst" \
            > SHA256SUMS

          echo "===== OUTPUT ====="
          ls -lh

          cat SHA256SUMS

      # ================================================
      # 13. Upload artifact
      # ================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.3-linux-arm64-debian13
          path: |
            dist/*.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ================================================
      # 14. Optional GitHub Release
      # ================================================

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-5.2.3-arm64-${{ github.run_number }}
          name: Blender 5.2.3 ARM64 Debian 13
          body: |
            Custom Blender 5.2.3 ARM64 build.

            Source: v5.2.3
            Architecture: ARM64
            Build OS: Debian 13 Trixie
            Dependencies: Built from source
            Rendering: Cycles CPU

            This is not an official Blender binary.
          files: |
            dist/*.tar.zst
            dist/SHA256SUMS

      # ================================================
      # 15. Diagnostics on failure
      # ================================================

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.3-arm64-diagnostics
          path: |
            build_linux/CMakeCache.txt
            build_linux/CMakeFiles/CMakeError.log
            build_linux/CMakeFiles/CMakeOutput.log
            blender/.gitmodules
            blender/.git/config
            blender/build_files/build_environment
            blender/lib/linux_arm64
          if-no-files-found: ignore
          retention-days: 7
