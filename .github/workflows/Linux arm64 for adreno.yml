name: Build Blender 5.2.3 ARM64 (Rocky Linux 8 - CPU & Vulkan Only)

on:
  workflow_dispatch:
    inputs:
      blender_version:
        description: 'Blender version tag'
        required: true
        default: 'v5.2.3'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - lite
          - debug
      gcc_version:
        description: 'GCC version'
        required: true
        default: '14'
        type: choice
        options:
          - 14
          - 11
      rebuild_deps:
        description: 'Force rebuild dependencies'
        required: false
        default: false
        type: boolean
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: rockylinux:8
      options: --privileged --user root

    steps:
      - name: Install base dependencies
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          dnf makecache
          retry 10 15 dnf install -y epel-release
          # 补充 Vulkan 相关的开发头文件和工具链
          retry 10 15 dnf install -y git git-lfs gcc-toolset-${{ github.event.inputs.gcc_version }} ccache python3 vulkan-loader-devel vulkan-headers vulkan-tools || true

          mv /usr/bin/sudo /usr/bin/sudo.orig || true
          cat > /usr/bin/sudo << 'EOF'
          #!/bin/bash
          if [ "$1" = "-y" ] || [ "$1" = "-n" ] || [ "$1" = "-E" ]; then
            shift
          fi
          exec "$@"
          EOF
          chmod +x /usr/bin/sudo

      - name: Setup Git LFS
        run: git-lfs install

      - name: Clone Blender repository
        run: |
          mkdir -p ~/blender-git
          cd ~/blender-git
          git clone -b ${{ github.event.inputs.blender_version }} --single-branch --depth 1 https://projects.blender.org/blender/blender.git

      - name: Clone patches repository
        run: |
          cd ~/blender-git
          if ! git clone -b ci --depth 1 ${{ github.server_url }}/${{ github.repository }}.git patches-repo 2>/dev/null; then
            echo "Failed to clone own repo, falling back to lfdevs community patches..."
            git clone -b ci --depth 1 https://github.com/lfdevs/blender-linux-arm64.git patches-repo
          fi

      - name: Apply patches
        run: |
          cd ~/blender-git/blender
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          PATCH_DIR=~/blender-git/patches-repo/patches/${{ github.event.inputs.blender_version }}
          if [ -d "$PATCH_DIR" ]; then
            echo "Found patches directory: $PATCH_DIR"
            for patch in $(ls -1 "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
              echo "Applying patch: $patch"
              git apply --verbose "$patch" || echo "Patch failed, skipping..."
            done
            git add -A
            git commit -m "Apply patches for ${{ github.event.inputs.blender_version }}" || echo "No changes to commit"
          else
            echo "No patches directory found for ${{ github.event.inputs.blender_version }}, trying v5.1.0..."
            FALLBACK_DIR=~/blender-git/patches-repo/patches/v5.1.0
            if [ -d "$FALLBACK_DIR" ]; then
              for patch in $(ls -1 "$FALLBACK_DIR"/*.patch 2>/dev/null | sort); do
                git apply --check "$patch" 2>/dev/null && git apply --verbose "$patch"
              done
            fi
          fi

          # 强制跳过 ROCm 安装
          SETUP_SCRIPT="build_files/build_environment/linux/linux_rocky8_setup.sh"
          if [ -f "$SETUP_SCRIPT" ] && ! grep -q 'if \[ "$(uname -i)" != "aarch64" \]' "$SETUP_SCRIPT"; then
            echo "Injecting aarch64 check for ROCm in $SETUP_SCRIPT"
            sed -i '/# Register ROCm packages/i if [ "$(uname -i)" != "aarch64" ]; then' "$SETUP_SCRIPT"
            sed -i '/update-alternatives --set rocm/a fi' "$SETUP_SCRIPT"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          chmod +x ~/blender-git/blender/build_files/build_environment/linux/linux_rocky8_setup.sh
          retry 10 15 ~/blender-git/blender/build_files/build_environment/linux/linux_rocky8_setup.sh
          echo "Cleaning dnf cache..."
          dnf clean all

      # --------------------------------------------------
      # 缓存机制：源码包缓存、编译产物缓存、ccache
      # --------------------------------------------------
      - name: Cache Download Packages
        uses: actions/cache@v4
        id: cache-pkgs
        with:
          path: ~/blender-git/build_linux/deps_arm64/packages
          key: blender-pkgs-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-v3
          restore-keys: |
            blender-pkgs-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Blender dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ~/blender-git/blender/lib/linux_arm64
          key: blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-v3
          restore-keys: |
            blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Pre-download dependencies (Python)
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        shell: bash
        run: |
          cd ~/blender-git/blender
          python3 << 'PYEOF'
          import re, os, subprocess, concurrent.futures, hashlib

          VERSIONS_FILE = "build_files/build_environment/cmake/versions.cmake"
          PKG_DIR = os.path.expanduser("~/blender-git/build_linux/deps_arm64/packages")
          os.makedirs(PKG_DIR, exist_ok=True)

          with open(VERSIONS_FILE) as f:
              content = f.read()

          matches = re.findall(r'set\(\s*(\w+)\s+["\']?([^"\'\n\)]+)["\']?\s*\)', content)
          variables = {k: v.strip() for k, v in matches}

          def resolve(text):
              for _ in range(10):
                  if "${" not in text: break
                  for k, v in variables.items():
                      text = text.replace("${" + k + "}", v)
              return text

          KNOWN_SHA256 = {
              "gmp-6.3.0.tar.xz": "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898",
          }

          def verify_sha256(filepath, expected):
              h = hashlib.sha256()
              with open(filepath, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              actual = h.hexdigest()
              if actual != expected:
                  raise RuntimeError(f"SHA256 mismatch for {os.path.basename(filepath)}: expected {expected}, got {actual}")
              print(f"[VERIFY OK] {os.path.basename(filepath)}")

          MIRROR_RULES = [
              ("https://gmplib.org/download/gmp/", [
                  "https://ftpmirror.gnu.org/gmp/",
                  "https://mirrors.kernel.org/gnu/gmp/",
                  "https://mirrors.tuna.tsinghua.edu.cn/gnu/gmp/",
              ]),
              ("http://prdownloads.sourceforge.net/", [
                  "https://master.dl.sourceforge.net/project/",
                  "https://downloads.sourceforge.net/project/",
              ]),
              ("http://downloads.sourceforge.net/", [
                  "https://downloads.sourceforge.net/",
                  "https://master.dl.sourceforge.net/",
              ]),
              ("https://breakfastquay.com/files/releases/", [
                  "https://github.com/breakfastquay/rubberband/releases/download/v4.0.0/",
                  "https://github.com/breakfastquay/rubberband/releases/download/4.0.0/" 
              ]),
              ("https://downloads.xiph.org/releases/", ["https://ftp.osuosl.org/pub/xiph/releases/"]),
              ("http://ftp.gnu.org/pub/gnu/", ["https://mirrors.kernel.org/gnu/", "https://mirrors.tuna.tsinghua.edu.cn/gnu/"]),
          ]

          tasks = []
          for k, v in variables.items():
              if k.endswith("_URI"):
                  base = k[:-4]
                  file_key = base + "_FILE"
                  if file_key in variables:
                      url = resolve(v)
                      filename = resolve(variables[file_key])
                      tasks.append((url, os.path.join(PKG_DIR, filename), filename))

          def download(url, dest, filename):
              if os.path.exists(dest) and os.path.getsize(dest) > 0:
                  print(f"[SKIP] {filename}")
                  if filename in KNOWN_SHA256:
                      verify_sha256(dest, KNOWN_SHA256[filename])
                  return

              urls_to_try = [url]
              for prefix, mirrors in MIRROR_RULES:
                  if url.startswith(prefix):
                      suffix = url[len(prefix):]
                      for mirror in mirrors:
                          urls_to_try.append(mirror + suffix)

              if "pthreads4w" in filename:
                  urls_to_try.append("https://sourceforge.net/projects/pthreads4w/files/pthreads4w-code-v3.0.0.zip/download")
                  urls_to_try.append("https://downloads.sourceforge.net/project/pthreads4w/pthreads4w-code-v3.0.0.zip")
              
              if "libpng" in filename:
                  urls_to_try.append("https://downloads.sourceforge.net/project/libpng/libpng16/1.6.58/libpng-1.6.58.tar.xz")
                  urls_to_try.append("https://master.dl.sourceforge.net/project/libpng/libpng16/1.6.58/libpng-1.6.58.tar.xz")
                  urls_to_try.append("https://github.com/pnggroup/libpng/releases/download/v1.6.58/libpng-1.6.58.tar.xz")

              for attempt_url in urls_to_try:
                  cmd = ["curl", "-L", "-4", "-A", "Mozilla/5.0", "-f", "-sS", "--connect-timeout", "15", "-o", dest, attempt_url]
                  if subprocess.run(cmd).returncode == 0 and os.path.getsize(dest) > 0:
                      print(f"[OK] {filename} (via {attempt_url})")
                      if filename in KNOWN_SHA256:
                          verify_sha256(dest, KNOWN_SHA256[filename])
                      return

              raise RuntimeError(f"Failed to download {filename} from all sources (original: {url})")

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              futures = [executor.submit(download, url, dest, fn) for url, dest, fn in tasks]
              for future in concurrent.futures.as_completed(futures):
                  future.result()

          print(f"\nAll dependencies downloaded and ready in {PKG_DIR}")
          PYEOF

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        shell: bash
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          cd ~/blender-git/blender
          
          export LANG=en_US.UTF-8
          
          export CC=/opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/root/usr/bin/g++
          
          retry 10 15 make deps -j$(nproc) ARGS="-DPACKAGE_DIR=$HOME/blender-git/build_linux/deps_arm64/packages -DPACKAGE_USE_UPSTREAM_SOURCES=OFF"
          unset CC CXX

      - name: Save Blender dependencies cache
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        uses: actions/cache/save@v4
        with:
          path: ~/blender-git/blender/lib/linux_arm64
          key: blender-deps-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Clean dependencies build artifacts
        if: steps.cache-deps.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == true
        run: |
          echo "Cleaning dependencies build directory to save space..."
          rm -rf ~/blender-git/build_linux
          echo "Dependencies build directory cleaned"

      - name: Verify dependencies
        run: |
          echo "Checking dependencies directory..."
          ls -lah ~/blender-git/blender/lib/linux_arm64/ || echo "Dependencies not found!"

      - name: Build Blender
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          
          mkdir -p ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          cd ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          
          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DWITH_LIBS_PRECOMPILED=ON
            -DLIBDIR=$HOME/blender-git/blender/lib/linux_arm64
            -DWITH_INSTALL_PORTABLE=ON
            -DCPACK_BINARY_TGZ=ON
            -DCPACK_BINARY_STGZ=OFF
            -DCPACK_BINARY_TZ=OFF
            -DCPACK_SOURCE_TBZ2=OFF
            -DCPACK_SOURCE_TGZ=OFF
            -DCPACK_SOURCE_TXZ=OFF
            -DCPACK_SOURCE_TZ=OFF
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
            # 核心修改：强制关闭非必要 GPU 后端
            -DWITH_CYCLES_DEVICE_CUDA=OFF
            -DWITH_CYCLES_DEVICE_OPTIX=OFF
            -DWITH_CYCLES_CUDA_BINARIES=OFF
            -DWITH_CYCLES_DEVICE_HIP=OFF
            -DWITH_CYCLES_DEVICE_METAL=OFF
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF
            -DWITH_CUDA_DYNLOAD=OFF
            
            # 核心修改：显式开启 CPU 渲染与 Vulkan 后端
            -DWITH_CYCLES=ON
            -DWITH_CYCLES_DEVICE_CPU=ON
            -DWITH_VULKAN_BACKEND=ON
            -DWITH_OPENGL=ON
          )

          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            cmake -C ../blender/build_files/cmake/config/blender_release.cmake "${CMAKE_ARGS[@]}" ../blender
          elif [ "${{ github.event.inputs.build_type }}" == "lite" ]; then
            cmake -C ../blender/build_files/cmake/config/blender_lite.cmake "${CMAKE_ARGS[@]}" ../blender
          else
            # 修复 Debug 模式下的变量替换逻辑
            for i in "${!CMAKE_ARGS[@]}"; do
              if [[ "${CMAKE_ARGS[$i]}" == "-DCMAKE_BUILD_TYPE=Release" ]]; then
                CMAKE_ARGS[$i]="-DCMAKE_BUILD_TYPE=Debug"
                break
              fi
            done
            cmake "${CMAKE_ARGS[@]}" ../blender
          fi

          echo "Building Blender..."
          ninja
          
          echo "Build completed successfully!"
          echo "ccache statistics:"
          ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Blender
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-${{ github.event.inputs.gcc_version }}/enable
          export CCACHE_DIR=/root/.ccache
          ccache -C
          cd ~/blender-git/build_linux_${{ github.event.inputs.build_type }}
          echo "Packaging Blender..."
          cpack
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.tar.gz" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64-${{ github.event.inputs.blender_version }}-${{ github.event.inputs.build_type }}
          path: |
            ~/blender-git/build_linux_${{ github.event.inputs.build_type }}/*.tar.gz
            ~/blender-git/build_linux_${{ github.event.inputs.build_type }}/sha256sums.txt
          retention-days: 90

      - name: Notify webhook on build failure
        if: ${{ failure() }}
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "WEBHOOK_URL is not configured, skipping failure notification"
            exit 0
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "curl is not available, skipping failure notification"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "GitHub CI Activity",
                  "content": [
                    [
                      {
                        "tag": "text",
                        "text": "Some jobs were not successful: "
                      },
                      {
                        "tag": "a",
                        "text": "View workflow run",
                        "href": "${RUN_URL}"
                      }
                    ]
                  ]
                }
              }
            }
          }
          EOF
          )

          curl --fail --show-error --silent -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs:
      - build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; -exec echo \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)
          cat <<'EOF' > release_body.md
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.blender_version }}
          name: Blender ${{ github.event.inputs.blender_version }} (Linux ARM64)
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.tar.gz