
name: Build Blender 5.2.3 ARM64 Debian 13

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "4"
        type: string

      publish_release:
        description: "Publish the result as a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Blender 5.2.3 for ARM64
    runs-on: ubuntu-26.04-arm

    container:
      image: debian:trixie

    timeout-minutes: 360

    env:
      BLENDER_TAG: v5.2.3
      BUILD_JOBS: ${{ inputs.build_jobs }}

      SOURCE_DIR: ${{ github.workspace }}/blender
      BUILD_DIR: ${{ github.workspace }}/build_linux
      DIST_DIR: ${{ github.workspace }}/dist
      STAGE_DIR: ${{ github.workspace }}/stage

    steps:
      # --------------------------------------------------
      # 1. Validate parameters
      # --------------------------------------------------

      - name: Validate build parameters
        shell: bash
        run: |
          set -euxo pipefail

          if [[ ! "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid BUILD_JOBS: $BUILD_JOBS"
            exit 1
          fi

          if [ "$(uname -m)" != "aarch64" ]; then
            echo "This workflow requires a native ARM64 runner."
            uname -a
            exit 1
          fi

          echo "Build jobs: $BUILD_JOBS"
          echo "Architecture: $(uname -m)"

      # --------------------------------------------------
      # 2. Install system dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            ninja-build \
            make \
            pkg-config \
            git \
            git-lfs \
            subversion \
            curl \
            wget \
            ca-certificates \
            file \
            patchelf \
            rsync \
            unzip \
            zip \
            xz-utils \
            zstd \
            tar \
            bzip2 \
            patch \
            perl \
            gawk \
            m4 \
            autoconf \
            automake \
            autopoint \
            libtool \
            gettext \
            help2man \
            texinfo \
            tcl \
            meson \
            flex \
            bison \
            yasm \
            nasm \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            python3-mako \
            python3-yaml \
            python3-setuptools \
            python3-wheel \
            libssl-dev \
            libffi-dev \
            libxml2-dev \
            libzstd-dev \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libncurses-dev \
            libsqlite3-dev \
            libtinfo-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libegl-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            libdrm-dev \
            libgbm-dev \
            libepoxy-dev \
            libosmesa6-dev \
            libdbus-1-dev \
            libudev-dev \
            libopenal-dev \
            libpulse-dev \
            libjack-jackd2-dev \
            libsndfile1-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libwebp-dev \
            libopenjp2-7-dev \
            libavif-dev \
            libtbb-dev \
            libjemalloc-dev

          git lfs install

      # --------------------------------------------------
      # 3. Verify environment
      # --------------------------------------------------

      - name: Verify ARM64 environment
        shell: bash
        run: |
          set -euxo pipefail

          uname -a
          dpkg --print-architecture
          gcc --version
          g++ --version
          cmake --version
          python3 --version

          test "$(dpkg --print-architecture)" = "arm64"

      - name: Verify dependency build tools
        shell: bash
        run: |
          set -euxo pipefail

          for tool in \
            cmake \
            ninja \
            gcc \
            g++ \
            make \
            git \
            curl \
            python3 \
            tclsh \
            autopoint \
            help2man \
            meson \
            nasm \
            yasm
          do
            command -v "$tool"
          done

      # --------------------------------------------------
      # 4. Configure Git LFS
      # --------------------------------------------------

      - name: Configure Git LFS
        shell: bash
        run: |
          set -euxo pipefail

          git config --global \
            url."https://projects.blender.org/".insteadOf \
            "https://git.blender.org/"

          git lfs install

      # --------------------------------------------------
      # 5. Cache Blender source repository
      # --------------------------------------------------

      - name: Cache Blender source repository
        uses: actions/cache@v4
        with:
          path: blender
          key: ${{ runner.os }}-${{ runner.arch }}-blender-source-${{ env.BLENDER_TAG }}

      # --------------------------------------------------
      # 6. Checkout Blender source
      # --------------------------------------------------

      - name: Checkout Blender 5.2.3 source
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "$SOURCE_DIR/.git" ]; then
            CURRENT_TAG="$(
              git -C "$SOURCE_DIR" describe \
                --tags \
                --exact-match 2>/dev/null || true
            )"

            if [ "$CURRENT_TAG" != "$BLENDER_TAG" ]; then
              rm -rf "$SOURCE_DIR"
            fi
          fi

          if [ ! -d "$SOURCE_DIR/.git" ]; then
            git clone \
              --depth 1 \
              --branch "$BLENDER_TAG" \
              https://projects.blender.org/blender/blender.git \
              "$SOURCE_DIR"
          fi

          cd "$SOURCE_DIR"

          git lfs pull

          echo "Blender version:"
          git describe --tags --exact-match

          git log -1 --oneline

          VERSION_HEADER="source/blender/blenkernel/BKE_blender_version.h"

          test -f "$VERSION_HEADER"

          grep -Eq \
            '^#define BLENDER_VERSION[[:space:]]+502$' \
            "$VERSION_HEADER"

          grep -Eq \
            '^#define BLENDER_VERSION_PATCH[[:space:]]+3$' \
            "$VERSION_HEADER"

          grep -Eq \
            '^#define BLENDER_VERSION_CYCLE[[:space:]]+release$' \
            "$VERSION_HEADER"

      # --------------------------------------------------
      # 7. Prepare dependency source cache
      # --------------------------------------------------

      - name: Prepare dependency source cache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$BUILD_DIR/deps_arm64/packages"

      # --------------------------------------------------
      # 8. Cache third-party dependency archives
      # --------------------------------------------------

      - name: Cache third-party dependency sources
        uses: actions/cache@v4
        with:
          path: build_linux/deps_arm64/packages
          key: ${{ runner.os }}-${{ runner.arch }}-blender-${{ env.BLENDER_TAG }}-dependency-sources-${{ hashFiles('blender/build_files/build_environment/cmake/versions.cmake') }}

      # --------------------------------------------------
      # 9. Prefetch ISPC and GMP
      # --------------------------------------------------

      - name: Prefetch ISPC and GMP source archives
        shell: bash
        run: |
          set -euxo pipefail

          VERSIONS_FILE="$SOURCE_DIR/build_files/build_environment/cmake/versions.cmake"
          PACKAGE_DIR="$BUILD_DIR/deps_arm64/packages"

          mkdir -p "$PACKAGE_DIR"

          python3 - "$VERSIONS_FILE" "$PACKAGE_DIR" <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          versions_file = Path(sys.argv[1])
          package_dir = Path(sys.argv[2])

          text = versions_file.read_text(encoding="utf-8")

          variables = {}

          pattern = re.compile(
              r"^\s*set\(\s*([A-Za-z0-9_]+)\s+(.+?)\s*\)\s*(?:#.*)?$"
          )

          for line in text.splitlines():
              match = pattern.match(line)

              if match:
                  key, value = match.groups()
                  variables[key] = value.strip().strip('"')

          def expand(value):
              for _ in range(20):
                  new_value = re.sub(
                      r"\$\{([A-Za-z0-9_]+)\}",
                      lambda m: variables.get(m.group(1), m.group(0)),
                      value
                  )

                  if new_value == value:
                      return value

                  value = new_value

              raise RuntimeError("CMake variable expansion exceeded limit")

          def get(name):
              if name not in variables:
                  raise RuntimeError(f"Missing CMake variable: {name}")

              return expand(variables[name])

          def verify(path, algorithm, expected):
              digest = hashlib.new(algorithm)

              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      digest.update(chunk)

              actual = digest.hexdigest()

              if actual.lower() != expected.lower():
                  raise RuntimeError(
                      f"Hash mismatch for {path.name}: "
                      f"expected {expected}, got {actual}"
                  )

          for package in ("ISPC", "GMP"):
              filename = get(f"{package}_FILE")
              url = get(f"{package}_URI")
              expected_hash = get(f"{package}_HASH")
              hash_type = get(f"{package}_HASH_TYPE").lower()

              if hash_type not in ("md5", "sha256", "sha512"):
                  raise RuntimeError(
                      f"Unsupported hash type: {hash_type}"
                  )

              if not url.startswith("https://"):
                  raise RuntimeError(
                      f"Refusing non-HTTPS URL: {url}"
                  )

              destination = package_dir / filename

              if destination.exists():
                  try:
                      verify(destination, hash_type, expected_hash)
                      print(f"[CACHE HIT] {filename}")
                      continue
                  except Exception:
                      print(f"[INVALID CACHE] Removing {filename}")
                      destination.unlink()

              fd, temp_name = tempfile.mkstemp(
                  prefix=filename + ".",
                  suffix=".download",
                  dir=package_dir
              )
              os.close(fd)

              temporary = Path(temp_name)

              try:
                  print(f"[DOWNLOAD] {url}")

                  subprocess.run(
                      [
                          "curl",
                          "--fail",
                          "--location",
                          "--retry", "10",
                          "--retry-all-errors",
                          "--retry-delay", "5",
                          "--retry-max-time", "1800",
                          "--connect-timeout", "30",
                          "--max-time", "3600",
                          "--output", str(temporary),
                          url
                      ],
                      check=True
                  )

                  if temporary.stat().st_size == 0:
                      raise RuntimeError("Downloaded archive is empty")

                  verify(temporary, hash_type, expected_hash)

                  os.replace(temporary, destination)

                  print(f"[VERIFIED] {filename}")

              finally:
                  if temporary.exists():
                      temporary.unlink()

          print("ISPC and GMP archives are ready.")
          PY

      # --------------------------------------------------
      # 10. Check dependency download endpoints
      # --------------------------------------------------

      - name: Check dependency download endpoints
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_DIR="$BUILD_DIR/deps_arm64/packages"

          ls -lah "$PACKAGE_DIR"

          test -n "$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name 'ispc-*.tar.gz' -print -quit)"
          test -n "$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name 'gmp-*.tar.xz' -print -quit)"

      # --------------------------------------------------
      # 11. Build ARM64 dependencies
      # --------------------------------------------------

      - name: Build ARM64 dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SOURCE_DIR"

          export CMAKE_BUILD_PARALLEL_LEVEL="$BUILD_JOBS"

          make deps NPROCS="$BUILD_JOBS"

          echo "Dependency build completed."

          echo "Dependency directories:"
          find "$SOURCE_DIR/lib" \
            -maxdepth 2 \
            -type d \
            2>/dev/null || true

          test -d "$SOURCE_DIR/lib/linux_arm64"

      # --------------------------------------------------
      # 12. Build Blender
      # --------------------------------------------------

      - name: Build Blender
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SOURCE_DIR"

          export CMAKE_BUILD_PARALLEL_LEVEL="$BUILD_JOBS"

          BUILD_CMAKE_ARGS="
            -DWITH_CYCLES=ON
            -DWITH_CYCLES_DEVICE_CPU=ON
            -DWITH_CYCLES_DEVICE_CUDA=OFF
            -DWITH_CYCLES_DEVICE_OPTIX=OFF
            -DWITH_CYCLES_DEVICE_HIP=OFF
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF
            -DWITH_CYCLES_DEVICE_METAL=OFF
            -DWITH_FFMPEG=ON
            -DWITH_OPENIMAGEIO=ON
            -DWITH_OPENVDB=ON
            -DWITH_USD=ON
            -DWITH_ALEMBIC=ON
            -DWITH_OPENSUBDIV=ON
            -DWITH_OPENCOLORIO=ON
            -DWITH_OPENEXR=ON
          "

          make \
            NPROCS="$BUILD_JOBS" \
            BUILD_CMAKE_ARGS="$BUILD_CMAKE_ARGS"

          test -x "$BUILD_DIR/bin/blender"

          "$BUILD_DIR/bin/blender" --version

      # --------------------------------------------------
      # 13. Inspect runtime dependencies
      # --------------------------------------------------

      - name: Inspect Blender runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail

          BLENDER="$BUILD_DIR/bin/blender"

          ldd "$BLENDER" | tee "$BUILD_DIR/ldd-report.txt" || true

          if grep -q "not found" "$BUILD_DIR/ldd-report.txt"; then
            echo "Missing runtime shared libraries detected."
            exit 1
          fi

      # --------------------------------------------------
      # 14. Verify build features
      # --------------------------------------------------

      - name: Verify Blender build features
        shell: bash
        run: |
          set -euxo pipefail

          "$BUILD_DIR/bin/blender" \
            --background \
            --factory-startup \
            --python-expr '
          import bpy

          print("Blender:", bpy.app.version_string)
          print("Architecture:", bpy.app.build_platform)
          print("Build options:")

          options = bpy.app.build_options

          for name in (
              "cycles",
              "ffmpeg",
              "openimageio",
              "openvdb",
              "usd",
              "alembic",
              "opensubdiv",
              "opencolorio",
              "openexr",
          ):
              print(f"{name}: {getattr(options, name, False)}")

          assert options.cycles, "Cycles is not enabled"
          '

      # --------------------------------------------------
      # 15. Test Cycles CPU rendering
      # --------------------------------------------------

      - name: Test Cycles CPU rendering
        shell: bash
        run: |
          set -euxo pipefail

          TEST_SCRIPT="$BUILD_DIR/test_cycles.py"

          cat > "$TEST_SCRIPT" <<'PY'
          import bpy

          scene = bpy.context.scene

          scene.render.engine = "CYCLES"
          scene.cycles.device = "CPU"

          scene.render.resolution_x = 32
          scene.render.resolution_y = 32
          scene.render.resolution_percentage = 100

          scene.cycles.samples = 2

          scene.render.image_settings.file_format = "PNG"
          scene.render.filepath = "/tmp/blender_cycles_test.png"

          bpy.ops.render.render(write_still=True)

          print("Cycles CPU render completed.")
          PY

          "$BUILD_DIR/bin/blender" \
            --background \
            --factory-startup \
            --python "$TEST_SCRIPT"

          test -s /tmp/blender_cycles_test.png

          file /tmp/blender_cycles_test.png

      # --------------------------------------------------
      # 16. Prepare portable package
      # --------------------------------------------------

      - name: Prepare portable package
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DIST_DIR" "$STAGE_DIR"

          mkdir -p "$DIST_DIR" "$STAGE_DIR"

          PACKAGE_NAME="blender-${BLENDER_TAG}-debian13-arm64"
          PACKAGE_DIR="$DIST_DIR/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"

          cp -a "$BUILD_DIR/bin/." "$PACKAGE_DIR/"

          test -x "$PACKAGE_DIR/blender"

          "$PACKAGE_DIR/blender" --version

          cat > "$PACKAGE_DIR/BUILD-INFO.txt" <<EOF
          Blender version: ${BLENDER_TAG}
          Architecture: ARM64
          Target userspace: Debian 13 Trixie
          Build runner: ubuntu-26.04-arm
          Build container: debian:trixie
          Build jobs: ${BUILD_JOBS}

          GPU compute:
          CUDA: disabled
          OptiX: disabled
          HIP: disabled
          oneAPI: disabled
          Cycles CPU: enabled
          EOF

          echo "Package contents:"
          du -sh "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -maxdepth 2 -type f | head -100

      # --------------------------------------------------
      # 17. Create archive and checksum
      # --------------------------------------------------

      - name: Create tar.zst archive
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_NAME="blender-${BLENDER_TAG}-debian13-arm64"

          ARCHIVE="$DIST_DIR/${PACKAGE_NAME}.tar.zst"

          tar \
            --zstd \
            -cf "$ARCHIVE" \
            -C "$DIST_DIR" \
            "$PACKAGE_NAME"

          cd "$DIST_DIR"

          sha256sum "${PACKAGE_NAME}.tar.zst" \
            > "${PACKAGE_NAME}.tar.zst.sha256"

          ls -lh "$DIST_DIR"

          sha256sum -c "${PACKAGE_NAME}.tar.zst.sha256"

      # --------------------------------------------------
      # 18. Upload build artifact
      # --------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ env.BLENDER_TAG }}-debian13-arm64
          path: |
            dist/*.tar.zst
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 19. Optional GitHub Release
      # --------------------------------------------------

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-v5.2.3-debian13-arm64
          name: Blender 5.2.3 Debian 13 ARM64
          body: |
            Blender v5.2.3 built for ARM64.

            Target userspace: Debian 13 Trixie.
            Cycles CPU rendering enabled.
            CUDA and OptiX disabled.

            This package is not statically linked.
            Runtime compatibility depends on the target system libraries
            and graphics drivers.
          files: |
            dist/*.tar.zst
            dist/*.sha256
          fail_on_unmatched_files: true

      # --------------------------------------------------
      # 20. Collect failure diagnostics
      # --------------------------------------------------

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail

          DIAG_DIR="$DIST_DIR/failure-diagnostics"

          mkdir -p "$DIAG_DIR"

          {
            echo "=== System ==="
            uname -a
            cat /etc/os-release
            dpkg --print-architecture

            echo
            echo "=== Compiler ==="
            gcc --version || true
            g++ --version || true
            cmake --version || true

            echo
            echo "=== Blender source ==="
            git -C "$SOURCE_DIR" status --short || true
            git -C "$SOURCE_DIR" describe --tags --exact-match || true
          } > "$DIAG_DIR/system-info.txt" 2>&1

          for item in \
            "$BUILD_DIR/CMakeCache.txt" \
            "$BUILD_DIR/CMakeFiles/CMakeError.log" \
            "$BUILD_DIR/CMakeFiles/CMakeOutput.log" \
            "$BUILD_DIR/ldd-report.txt"
          do
            if [ -f "$item" ]; then
              cp --parents "$item" "$DIAG_DIR/"
            fi
          done

          if [ -d "$BUILD_DIR/deps_arm64" ]; then
            find "$BUILD_DIR/deps_arm64" \
              -maxdepth 4 \
              \( -name '*.log' -o -name 'CMakeCache.txt' \) \
              -type f \
              -print \
              > "$DIAG_DIR/dependency-log-list.txt" || true
          fi

          if [ -d "$SOURCE_DIR" ]; then
            find "$SOURCE_DIR" \
              -maxdepth 3 \
              -name 'CMakeError.log' \
              -o -name 'CMakeOutput.log' \
              2>/dev/null \
              > "$DIAG_DIR/source-cmake-log-list.txt" || true
          fi

          tar -czf "$DIST_DIR/failure-diagnostics.tar.gz" \
            -C "$DIST_DIR" \
            failure-diagnostics

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-build-failure-diagnostics
          path: dist/failure-diagnostics.tar.gz
          if-no-files-found: ignore
          retention-days: 14
