name: Build Blender 5.2.3 ARM64 Debian 13

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "4"
        type: string

      publish_release:
        description: "Publish the result as a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Blender 5.2.3 for ARM64
    runs-on: ubuntu-26.04-arm

    container:
      image: debian:trixie

    timeout-minutes: 480

    env:
      BLENDER_TAG: v5.2.3
      BUILD_JOBS: ${{ inputs.build_jobs }}

      SOURCE_DIR: ${{ github.workspace }}/blender
      BUILD_DIR: ${{ github.workspace }}/build_linux
      DIST_DIR: ${{ github.workspace }}/dist
      STAGE_DIR: ${{ github.workspace }}/stage
      PKG_DIR: ${{ github.workspace }}/build_linux/deps_arm64/packages

    steps:
      # --------------------------------------------------
      # 1. 校验参数与环境
      # --------------------------------------------------
      - name: Validate build parameters
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid BUILD_JOBS: $BUILD_JOBS"
            exit 1
          fi
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "This workflow requires a native ARM64 runner."
            uname -a
            exit 1
          fi
          echo "Build jobs: $BUILD_JOBS, Architecture: $(uname -m)"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc g++ cmake ninja-build make pkg-config \
            git git-lfs subversion curl wget ca-certificates file patchelf rsync \
            unzip zip xz-utils zstd tar bzip2 patch perl gawk m4 autoconf automake \
            autopoint libtool gettext help2man texinfo tcl meson flex bison yasm nasm \
            python3 python3-dev python3-venv python3-pip python3-mako python3-yaml \
            python3-setuptools python3-wheel libssl-dev libffi-dev libxml2-dev \
            libzstd-dev liblzma-dev libbz2-dev libreadline-dev libncurses-dev \
            libsqlite3-dev libtinfo-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libfribidi-dev libx11-dev libxext-dev libxrender-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev \
            libxxf86vm-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libglu1-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libepoxy-dev libosmesa6-dev libdbus-1-dev \
            libudev-dev libopenal-dev libpulse-dev libjack-jackd2-dev libsndfile1-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev libopenjp2-7-dev \
            libavif-dev libtbb-dev libjemalloc-dev
          git lfs install

      # --------------------------------------------------
      # 2. 环境修复与源码缓存
      # --------------------------------------------------
      - name: Fix hashlib MD5 for OpenSSL 3 strict mode
        shell: bash
        run: |
          set -euxo pipefail
          SITE_DIR="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
          SITECUSTOMIZE="$SITE_DIR/sitecustomize.py"
          [ -f "$SITECUSTOMIZE" ] && cp "$SITECUSTOMIZE" "$SITECUSTOMIZE.bak"
          cat > "$SITECUSTOMIZE" <<'PYEOF'
          import hashlib
          _original_md5 = hashlib.md5
          def md5(*args, **kwargs):
              kwargs.setdefault("usedforsecurity", False)
              return _original_md5(*args, **kwargs)
          hashlib.md5 = md5
          PYEOF
          python3 -c "import hashlib; hashlib.md5(b'test')"

      - name: Configure Git LFS
        shell: bash
        run: |
          git config --global url."https://projects.blender.org/".insteadOf "https://git.blender.org/"
          git lfs install

      - name: Cache Blender source repository
        uses: actions/cache@v4
        with:
          path: blender
          key: ${{ runner.os }}-${{ runner.arch }}-blender-source-${{ env.BLENDER_TAG }}

      - name: Checkout Blender source
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "$SOURCE_DIR/.git" ]; then
            CURRENT_TAG="$(git -C "$SOURCE_DIR" describe --tags --exact-match 2>/dev/null || true)"
            if [ "$CURRENT_TAG" != "$BLENDER_TAG" ]; then rm -rf "$SOURCE_DIR"; fi
          fi
          if [ ! -d "$SOURCE_DIR/.git" ]; then
            git clone --depth 1 --branch "$BLENDER_TAG" https://projects.blender.org/blender/blender.git "$SOURCE_DIR"
          fi
          cd "$SOURCE_DIR" && git lfs pull
          git describe --tags --exact-match

      # --------------------------------------------------
      # 3. 带镜像回退机制的高速 Python 预下载
      # --------------------------------------------------
      - name: Cache Blender Dependencies Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PKG_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-blender-deps-packages-${{ env.BLENDER_TAG }}

      - name: Pre-download dependencies concurrently (Python)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          
          python3 << 'PYEOF'
          import re, os, subprocess, concurrent.futures
          
          VERSIONS_FILE = "build_files/build_environment/cmake/versions.cmake"
          PKG_DIR = os.environ.get("PKG_DIR")
          os.makedirs(PKG_DIR, exist_ok=True)

          with open(VERSIONS_FILE) as f:
              content = f.read()

          # 提取所有变量
          matches = re.findall(r'set\(\s*(\w+)\s+["\']?([^"\'\n\)]+)["\']?\s*\)', content)
          variables = {k: v.strip() for k, v in matches}

          def resolve(text):
              for _ in range(10):
                  if "${" not in text: break
                  for k, v in variables.items():
                      text = text.replace("${" + k + "}", v)
              return text

          # 定义常见易挂源的备用镜像站
          MIRROR_RULES = [
              ("https://gmplib.org/download/", ["https://mirrors.kernel.org/gnu/gmp/", "https://mirrors.tuna.tsinghua.edu.cn/gnu/gmp/"]),
              ("http://downloads.sourceforge.net/", ["https://downloads.sourceforge.net/", "https://master.dl.sourceforge.net/project/"]),
              ("http://prdownloads.sourceforge.net/", ["https://downloads.sourceforge.net/"]),
              ("https://breakfastquay.com/files/releases/", ["https://github.com/breakfastquay/rubberband/releases/download/4.0.0/"]),
              ("https://downloads.xiph.org/releases/", ["https://ftp.osuosl.org/pub/xiph/releases/"]),
              ("http://ftp.gnu.org/pub/gnu/", ["https://mirrors.kernel.org/gnu/", "https://mirrors.tuna.tsinghua.edu.cn/gnu/"]),
          ]

          # 找出所有需要下载的 URI 和对应的文件
          tasks = []
          for k, v in variables.items():
              if k.endswith("_URI"):
                  base = k[:-4]
                  file_key = base + "_FILE"
                  if file_key in variables:
                      url = resolve(v)
                      filename = resolve(variables[file_key])
                      tasks.append((url, os.path.join(PKG_DIR, filename), filename))

          def download(url, dest, filename):
              if os.path.exists(dest) and os.path.getsize(dest) > 0:
                  print(f"[SKIP] {filename}")
                  return

              urls_to_try = [url]
              # 根据规则寻找备用镜像
              for prefix, mirrors in MIRROR_RULES:
                  if url.startswith(prefix):
                      suffix = url[len(prefix):]
                      for mirror in mirrors:
                          urls_to_try.append(mirror + suffix)

              for attempt_url in urls_to_try:
                  # 强制 IPv4，10秒连接超时，遇到网络问题立刻换源
                  cmd = ["curl", "-L", "-4", "-f", "-sS", "--connect-timeout", "10", "-o", dest, attempt_url]
                  if subprocess.run(cmd).returncode == 0 and os.path.getsize(dest) > 0:
                      print(f"[OK] {filename} (via {attempt_url})")
                      return

              raise RuntimeError(f"Failed to download {filename} from all sources (original: {url})")

          # 8 线程并发下载
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              futures = [executor.submit(download, url, dest, fn) for url, dest, fn in tasks]
              for future in concurrent.futures.as_completed(futures):
                  future.result() # 如果彻底失败则抛出异常中断

          print(f"\nAll dependencies downloaded and ready in {PKG_DIR}")
          PYEOF

      # --------------------------------------------------
      # 4. 编译依赖、主程序与打包
      # --------------------------------------------------
      - name: Build Blender Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          # 强制离线构建，只用上面的本地包
          make deps -j"$BUILD_JOBS" ARGS="-DPACKAGE_DIR=$PKG_DIR -DPACKAGE_USE_UPSTREAM_SOURCES=OFF"

      - name: Build Blender
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          make config
          make -j"$BUILD_JOBS"

      - name: Package Blender
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          make package
          mkdir -p "$DIST_DIR"
          find "$BUILD_DIR" -name "*.tar.*" -exec cp {} "$DIST_DIR/" \;
          ls -lh "$DIST_DIR"

      # --------------------------------------------------
      # 5. 产物上传与发布
      # --------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64-package
          path: ${{ env.DIST_DIR }}/*.tar.*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BLENDER_TAG }}-arm64
          name: Blender ${{ env.BLENDER_TAG }} (Linux ARM64)
          files: ${{ env.DIST_DIR }}/*.tar.*
          token: ${{ secrets.GITHUB_TOKEN }}
