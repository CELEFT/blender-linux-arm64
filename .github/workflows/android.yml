name: Build Blender (Android ARM64) [Termux NDK]

on:
  workflow_dispatch:
    inputs:
      blender_version:
        description: 'Blender version tag'
        required: true
        default: 'v5.0.1'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - lite
          - debug
      ndk_api:
        description: 'Android API level'
        required: true
        default: '34'
      rebuild_deps:
        description: 'Force rebuild prebuilt libraries'
        required: false
        default: false
        type: boolean
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs ccache cmake ninja-build \
            wget unzip build-essential \
            autoconf automake libtool pkg-config \
            libx11-dev libxxf86vm-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev \
            libegl1-mesa-dev libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev libpulse-dev \
            libssl-dev libbz2-dev liblzma-dev \
            libtbb-dev libopenexr-dev libjpeg-dev \
            libpng-dev libtiff-dev libwebp-dev \
            libopenal-dev libsndfile1-dev libfftw3-dev \
            libspnav-dev libjack-dev \
            flex bison patchelf

      - name: Setup Git LFS
        run: git lfs install

      - name: Clone Blender repository
        run: |
          mkdir -p ~/blender-git
          cd ~/blender-git
          git clone -b ${{ github.event.inputs.blender_version }} --single-branch --depth 1 \
            https://projects.blender.org/blender/blender.git

      - name: Clone patches repository
        run: |
          cd ~/blender-git
          git clone -b ci --depth 1 ${{ github.server_url }}/${{ github.repository }}.git patches-repo

      - name: Apply patches
        run: |
          cd ~/blender-git/blender
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          PATCH_DIR=~/blender-git/patches-repo/patches/${{ github.event.inputs.blender_version }}
          if [ -d "$PATCH_DIR" ]; then
            for patch in $(ls -1 "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
              echo "Applying patch: $patch"
              git apply --verbose "$patch"
            done
            git add -A
            git commit -m "Apply patches for ${{ github.event.inputs.blender_version }}" || echo "No changes to commit"
          else
            echo "No patches directory found, skipping..."
          fi

      - name: Download Android NDK
        run: |
          NDK_URL="https://googledownloads.cn/android/repository/android-ndk-r29-linux.zip"
          NDK_DIR="$HOME/android-ndk-r29"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK r29..."
            wget -q --show-progress "$NDK_URL" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Cache prebuilt libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ~/blender-git/blender/../lib/android_arm64
          key: android-libs-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ github.event.inputs.ndk_api }}-v1

      - name: Build prebuilt libraries if missing
        if: steps.cache-libs.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == 'true'
        run: |
          cd ~/blender-git/blender
          export ANDROID_NDK_HOME=$NDK_HOME
          export ANDROID_NDK=$NDK_HOME
          export ANDROID_API=${{ github.event.inputs.ndk_api }}
          # Use Blender's own build script for prebuilt libraries (android)
          # This step may need customization of the build_environment scripts
          python3 build_files/utils/make_deps.py android --arch arm64 \
            --ndk $NDK_HOME --api $ANDROID_API \
            --build-dir $HOME/blender-git/build_deps 2>&1 | tee build_deps.log
        shell: bash

      - name: Save prebuilt libraries to cache
        if: steps.cache-libs.outputs.cache-hit != 'true' || github.event.inputs.rebuild_deps == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/blender-git/blender/../lib/android_arm64
          key: android-libs-${{ github.event.inputs.blender_version }}-${{ runner.os }}-${{ github.event.inputs.ndk_api }}-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-android-${{ runner.os }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=$HOME/.ccache
          ccache --max-size=2G
          ccache --zero-stats

      - name: Build Blender for Android
        run: |
          cd ~/blender-git
          BUILD_DIR="$HOME/blender-git/build_android_${{ github.event.inputs.build_type }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          export ANDROID_NDK=$HOME/android-ndk-r29
          export ANDROID_SDK_ROOT=""
          export ANDROID_API=${{ github.event.inputs.ndk_api }}
          export ANDROID_ABI=arm64-v8a

          # Use NDK Clang as compilers
          TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang
          export LD=$TOOLCHAIN/bin/ld.lld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          # Common CMake flags
          CMAKE_BASE=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
            -DANDROID=ON
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-${ANDROID_API}
            -DANDROID_NDK=$ANDROID_NDK
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake
            -DWITH_LIBS_PRECOMPILED=ON
            -DLIBDIR=$HOME/blender-git/lib/android_arm64
            -DWITH_INSTALL_PORTABLE=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            ../blender
          )

          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            cmake "${CMAKE_BASE[@]}" -C ../blender/build_files/cmake/config/blender_release.cmake
          elif [ "${{ github.event.inputs.build_type }}" == "lite" ]; then
            cmake "${CMAKE_BASE[@]}" -C ../blender/build_files/cmake/config/blender_lite.cmake
          else
            cmake "${CMAKE_BASE[@]}"
          fi

          ninja -j$(nproc)
          echo "Build finished."
          ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Blender
        run: |
          cd ~/blender-git/build_android_${{ github.event.inputs.build_type }}
          ninja install
          # Create tarball of the install directory
          INSTALL_DIR="$HOME/blender-git/build_android_${{ github.event.inputs.build_type }}/install"
          if [ -d "$INSTALL_DIR" ]; then
            cd "$INSTALL_DIR"
            tar czf "$HOME/blender-git/blender-android-arm64-${{ github.event.inputs.blender_version }}-${{ github.event.inputs.build_type }}.tar.gz" .
            sha256sum "$HOME/blender-git/blender-android-arm64-${{ github.event.inputs.blender_version }}-${{ github.event.inputs.build_type }}.tar.gz" > "$HOME/blender-git/sha256sums.txt"
          else
            echo "Install directory not found!"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-arm64-${{ github.event.inputs.blender_version }}-${{ github.event.inputs.build_type }}
          path: |
            ${{ github.workspace }}/blender-android-arm64-*.tar.gz
            ${{ github.workspace }}/sha256sums.txt
          retention-days: 90

      - name: Notify webhook on failure
        if: failure()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then exit 0; fi
          if ! command -v curl >/dev/null 2>&1; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "GitHub CI Activity",
                  "content": [
                    [
                      {"tag": "text", "text": "Some jobs were not successful: "},
                      {"tag": "a", "text": "View workflow run", "href": "${RUN_URL}"}
                    ]
                  ]
                }
              }
            }
          }
          EOF
          )
          curl --fail --show-error --silent -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; | sort -k2)
          cat <<EOF > release_body.md
          ## Checksums
          \`\`\`plaintext
          $checksums
          \`\`\`
          EOF

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.blender_version }}
          name: ${{ github.event.inputs.blender_version }}
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.tar.gz